[project]
name = "system-trading-lab"
version = "0.1.0"
description = "Reproducible SPY moving-average research experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vibe-trading-ai==0.1.15",
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "matplotlib>=3.9,<4",
    "yfinance>=1,<2",
    "exchange-calendars>=4.11,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
