<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Phòng thử nghiệm trading{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317221f'/%3E%3Cpath d='M8 21l5-6 4 3 7-8' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Về thư viện thí nghiệm">
      <span class="brand-mark">ST</span>
      <span>System Trading Lab</span>
    </a>
    <nav class="top-nav" aria-label="Điều hướng chính">
      <a href="/datasets">Dữ liệu</a>
      <span class="research-badge">Research only</span>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Backtest là công cụ học và kiểm chứng giả thuyết, không phải khuyến nghị đầu tư.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
