services:
  worker:
    build:
      context: ../..
      dockerfile: deploy/intraday/Dockerfile
    command: ["portfolio", "${PORTFOLIO_WORKER_MODE:-soak}", "run"]
    env_file:
      - ${INTRADAY_ENV_FILE:-../../.env.intraday}
    environment:
      INTRADAY_PROVIDER_SECRETS_FILE: /run/provider-secrets/provider-secrets.toml
      INTRADAY_CRYPTORANK_API_KEY_FILE: /run/source-secrets/cryptorank-api-key
    volumes:
      - intraday-state:/app/state/intraday
      - type: bind
        source: ${INTRADAY_PROVIDER_SECRETS_HOST_DIR:-../../state/provider-secrets}
        target: /run/provider-secrets
        read_only: true
      - type: bind
        source: ${INTRADAY_SOURCE_SECRETS_HOST_DIR:-../../state/source-secrets}
        target: /run/source-secrets
        read_only: true
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/intraday/Dockerfile
    command: ["serve"]
    env_file:
      - ${INTRADAY_ENV_FILE:-../../.env.intraday}
    volumes:
      - intraday-state:/app/state/intraday
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  admin:
    profiles: ["admin"]
    build:
      context: ../..
      dockerfile: deploy/intraday/Dockerfile
    env_file:
      - ${INTRADAY_ENV_FILE:-../../.env.intraday}
    environment:
      INTRADAY_PROVIDER_SECRETS_FILE: /run/provider-secrets/provider-secrets.toml
    volumes:
      - intraday-state:/app/state/intraday
      - type: bind
        source: ${INTRADAY_PROVIDER_SECRETS_HOST_DIR:-../../state/provider-secrets}
        target: /run/provider-secrets
    command: ["doctor"]

  demo-execution:
    profiles: ["demo"]
    build:
      context: ../..
      dockerfile: deploy/intraday/Dockerfile
    user: "${AIGT_EXECUTION_UID:-1000}:${AIGT_EXECUTION_GID:-1000}"
    command: ["execution", "demo", "run", "--multi", "--source-database", "/app/state/intraday/intraday.sqlite3", "--execution-database", "/app/state/execution/binance-demo.sqlite3", "--secrets-file", "/run/execution-secrets/binance-demo.json", "--interval-seconds", "30"]
    volumes:
      - type: volume
        source: intraday-state
        target: /app/state/intraday
        read_only: true
      - type: bind
        source: ${AIGT_EXECUTION_HOST_DIR:-../../state/execution}
        target: /app/state/execution
        bind:
          create_host_path: false
      - type: bind
        source: ${AIGT_EXECUTION_SECRETS_HOST_DIR:-../../state/execution-secrets}
        target: /run/execution-secrets
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

volumes:
  intraday-state:
